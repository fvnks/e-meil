[package]
name = "e-meil"
version = "0.1.0"
description = "Cliente de correo open source para Windows y Linux"
authors = ["e-Meil contributors"]
edition = "2021"

[lib]
name = "emeil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
keyring = { version = "3", features = ["windows-native", "linux-native-sync-persistent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = "2.4"
native-tls = "0.2"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "native-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
tauri-plugin-notification = "2"
regex = "1"
mime_guess = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
pretty_assertions = "1.4"
