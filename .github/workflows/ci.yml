name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend (Svelte + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipado y plantillas (svelte-check)
        run: pnpm exec svelte-check --threshold error
      - name: Build de producción
        run: pnpm build
      - name: Auditoría de contraste WCAG (10 scopes claro/oscuro)
        run: node scripts/contrast-audit.mjs

  frontend-browser:
    name: Frontend en navegador real (CDP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Servidor de desarrollo + Chrome headless con CDP
        run: |
          pnpm dev --port 5173 &
          google-chrome --headless=new --remote-debugging-port=9222 --no-sandbox --user-data-dir=/tmp/emeil-chrome about:blank &
          sleep 8
      - name: Focus trap del modal (9 comprobaciones)
        run: node scripts/verify-modal-a11y.mjs http://127.0.0.1:5173/
      - name: Drawer móvil y overlays (12 comprobaciones)
        run: node scripts/verify-responsive.mjs http://127.0.0.1:5173/
      - name: 'Teclado: menú APG + Escape en cascada (7 comprobaciones)'
        run: node scripts/verify-keyboard.mjs http://127.0.0.1:5173/
      - name: Benchmark de rendimiento con presupuestos
        run: pnpm run test:performance http://127.0.0.1:5173/

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de sistema de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tests unitarios (IMAP/POP3/OAuth)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Chequeo de compilación de la app completa
        run: cargo check --manifest-path src-tauri/Cargo.toml
